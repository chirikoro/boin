[workspace]
resolver = "2"
members = ["crates/boin-core", "crates/boin-cli", "crates/boin-gui", "crates/vc-convert"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = 3

# 開発ビルドでも推論・変換が現実的な速度で動くよう依存クレートは最適化する
[profile.dev.package."*"]
opt-level = 3
